[project]
name = "road-safety-action-explorer"
version = "1.0.0"
description = "State traffic-fatality snapshots linked to published Safe System countermeasures (public data only)."
requires-python = ">=3.11"
authors = [{ name = "Sai Kurmana, MPH, MS, CPHIMS" }]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
