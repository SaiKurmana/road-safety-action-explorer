about: Lockfile of every public source used by Road Safety Action Explorer. Generated by `python -m pipeline.sources
  refresh`; verified by `make ingest`.
fars_discovery:
  human_listing_url: https://www.nhtsa.gov/file-downloads?p=nhtsa/downloads/FARS/
  machine_listing_url: https://static.nhtsa.gov/?prefix=nhtsa/downloads/FARS/&delimiter=/
  method: Year folders and file keys are read from the S3 bucket listing that backs NHTSA's File Downloads page;
    FINAL vs Annual Report File status is read from each year's release notes.
  crashapi_note: The FARS CrashAPI (crashviewer.nhtsa.dot.gov/CrashAPI) and www.nhtsa.gov returned HTTP 403 (Akamai
    'Access Denied') from cloud build environments; the API is not used anywhere.
  years_in_listing:
  - year: 2010
    status: final
    basis: release notes do not state status; inferred final because a newer year (2023) is explicitly final and
      ARFs are replaced by finals in year order
  - year: 2011
    status: final
    basis: release notes do not state status; inferred final because a newer year (2023) is explicitly final and
      ARFs are replaced by finals in year order
  - year: 2012
    status: final
