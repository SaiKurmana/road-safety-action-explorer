      ARFs are replaced by finals in year order
  - year: 2015
    status: final
    basis: stated in release notes
  - year: 2016
    status: final
    basis: stated in release notes
  - year: 2017
    status: final
    basis: stated in release notes
  - year: 2018
    status: final
    basis: stated in release notes
  - year: 2019
    status: final
    basis: stated in release notes
  - year: 2020
    status: final
    basis: stated in release notes
  - year: 2021
    status: final
    basis: stated in release notes
  - year: 2022
    status: final
    basis: stated in release notes
  - year: 2023
    status: final
    basis: stated in release notes
  - year: 2024
    status: annual_report_file
    basis: stated in release notes
  analysis_years:
  - 2014
  - 2015
  - 2016
  - 2017
  - 2018
  - 2019
  - 2020
  - 2021
  - 2022
  - 2023
