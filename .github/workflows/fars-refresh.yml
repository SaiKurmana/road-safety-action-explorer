name: Weekly FARS final-year check

# Uses NHTSA's official bulk-file listing (static.nhtsa.gov) only. The FARS CrashAPI is never
# called: it returns HTTP 403 (Akamai) to cloud runners. See docs/methods.md.
on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check NHTSA listing for a newer FARS final year
        id: check
        run: python -m pipeline.check_new_fars
      - name: Refresh sources, rebuild aggregates, test, and build site
        if: steps.check.outputs.new_final_year != ''
        run: |
          make refresh-sources
          make ingest
          make transform
          make verify-citations
          make test
          make site
      - name: Open pull request
        if: steps.check.outputs.new_final_year != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/fars-final-${{ steps.check.outputs.new_final_year }}
          title: "Data: add FARS ${{ steps.check.outputs.new_final_year }} final file"
          commit-message: "Refresh sources and aggregates for FARS ${{ steps.check.outputs.new_final_year }} final file"
          body: |
            NHTSA's FARS listing now marks **${{ steps.check.outputs.new_final_year }}** as a FINAL file (per its release notes).

            This PR was generated by the weekly check. It:
            - re-discovered and checksum-verified all sources (`sources.yml`),
            - rebuilt the state x year aggregates and marts (10 most recent final years),
            - re-verified every action-library citation, and
            - passed `make test` and `make site`.

            Review before merging: check `sources.yml` changes (revised prior-year files, new Census vintage, new VM-2 table), the published-benchmark test, and the signal changes in `data/marts/fct_state_signals.csv`.
          add-paths: |
            sources.yml
            data/aggregates
            data/marts
            docs/data_dictionary.md
