about: Action library for Road Safety Action Explorer. Every entry is taken from a published source that was opened and read;
  titles, ratings, and benefit statements are carried over verbatim. Classification fields (safe_system_element, prevention_level,
  lead_sectors, topic_tags) are curator classifications that follow the rules in docs/action_library_curation.md. This file
  describes resources; it does not recommend actions.
vocabularies:
  safe_system_element:
  - Safe Road Users
  - Safe Vehicles
  - Safe Speeds
  - Safe Roads
  - Post-Crash Care
  prevention_level:
    primary_upstream: 'Primary / upstream: changes roads, speeds, or vehicles (system design)'
    individual_behavior: 'Individual behavior: targets road-user behavior (laws, enforcement, education)'
    post_crash: 'Post-crash: survivability after a crash (EMS, trauma care, incident management)'
  lead_sectors:
  - Community groups
  - Courts and justice system
  - Driver licensing agency
  - EMS
  - Employers
  - Federal agencies
  - Health care providers
  - Health department
  - Highway safety office
  - Law enforcement
  - Local transportation agencies
  - Schools
  - State DOT
  - State legislature
  topic_tags:
  - alcohol
  - bicycle
  - crosscutting
  - intersection
  - motorcycle
  - occupant_protection
  - older_driver
  - pedestrian
  - post_crash
  - roadway_departure
  - speed
  - vehicles
  - young_driver
